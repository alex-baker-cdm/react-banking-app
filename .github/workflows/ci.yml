name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run eslint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm test -- --no-watch
      - run: npm run build
