name: Devin CI Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  sca-vulnerability-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Create Devin Session
        id: create-session
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          DEVIN_PLAYBOOK_ID: "playbook-88e89fadd5c141c6bd5e5942b0e31ba8"
        run: |
          echo "Creating Devin session for SCA vulnerability check..."
          
          RESPONSE=$(curl -s --request POST \
            --url "https://api.devin.ai/v3/organizations/${DEVIN_ORG_ID}/sessions" \
            --header "Authorization: Bearer ${DEVIN_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "{
              \"prompt\": \"Run the SCA Vulnerability Check playbook. Repository: ${{ github.repository }}, PR #${{ github.event.pull_request.number }}, Branch: ${{ github.head_ref }}. Clone the repo, checkout the PR branch (${{ github.head_ref }}), run the Snyk SCA scan, and if you find simple fixes, push them to the ${{ github.head_ref }} branch.\",
              \"playbook_id\": \"${DEVIN_PLAYBOOK_ID}\"
            }")
          
          echo "Response: $RESPONSE"
          
          SESSION_ID=$(echo "$RESPONSE" | jq -r '.session_id')
          if [ "$SESSION_ID" == "null" ] || [ -z "$SESSION_ID" ]; then
            echo "Failed to create session"
            exit 1
          fi
          
          DEVIN_ID="devin-${SESSION_ID}"
          echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
          echo "devin_id=$DEVIN_ID" >> $GITHUB_OUTPUT
          echo "Created session: $SESSION_ID (devin_id: $DEVIN_ID)"

      - name: Wait for Session to Complete
        id: wait-session
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          DEVIN_ID: ${{ steps.create-session.outputs.devin_id }}
          SESSION_ID: ${{ steps.create-session.outputs.session_id }}
        run: |
          echo "Waiting for session $DEVIN_ID to complete..."
          
          MAX_ATTEMPTS=75
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            RESPONSE=$(curl -s --request GET \
              --url "https://api.devin.ai/v3/organizations/${DEVIN_ORG_ID}/sessions/${DEVIN_ID}" \
              --header "Authorization: Bearer ${DEVIN_API_KEY}")
            
            STATUS=$(echo "$RESPONSE" | jq -r '.status')
            STATUS_DETAIL=$(echo "$RESPONSE" | jq -r '.status_detail // ""')
            echo "Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS - Status: $STATUS (detail: $STATUS_DETAIL)"
            
            if [ "$STATUS" == "exit" ] || [ "$STATUS" == "error" ] || [ "$STATUS" == "suspended" ] || [ "$STATUS_DETAIL" == "waiting_for_user" ]; then
              echo "Session completed with status: $STATUS (detail: $STATUS_DETAIL)"
              
              STRUCTURED_OUTPUT=$(echo "$RESPONSE" | jq -c '.structured_output // {}')
              echo "structured_output=$STRUCTURED_OUTPUT" >> $GITHUB_OUTPUT
              
              # Session completed successfully if it didn't error out
              if [ "$STATUS" == "error" ]; then
                echo "check_passed=false" >> $GITHUB_OUTPUT
                echo "details=Session ended with error" >> $GITHUB_OUTPUT
              else
                echo "check_passed=true" >> $GITHUB_OUTPUT
                DETAILS=$(echo "$RESPONSE" | jq -r '.structured_output.details // "SCA scan completed"')
                echo "details=$DETAILS" >> $GITHUB_OUTPUT
              fi
              
              break
            fi
            
            ATTEMPT=$((ATTEMPT+1))
            sleep 15
          done
          
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Session timed out"
            echo "check_passed=false" >> $GITHUB_OUTPUT
            echo "details=Session timed out after 20 minutes" >> $GITHUB_OUTPUT
          fi

      - name: Check Results
        env:
          CHECK_PASSED: ${{ steps.wait-session.outputs.check_passed }}
          DETAILS: ${{ steps.wait-session.outputs.details }}
          SESSION_ID: ${{ steps.create-session.outputs.session_id }}
        run: |
          echo "SCA Vulnerability Check Results:"
          echo "  Passed: $CHECK_PASSED"
          echo "  Details: $DETAILS"
          echo "  Session: https://app.devin.ai/sessions/$SESSION_ID"
          
          if [ "$CHECK_PASSED" != "true" ]; then
            echo "SCA vulnerability check failed!"
            exit 1
          fi
          
          echo "SCA vulnerability check passed!"
