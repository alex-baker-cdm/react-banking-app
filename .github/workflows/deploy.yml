name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wf-online-banking
  APP_RUNNER_SERVICE_NAME: wf-online-banking-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::438468714515:role/wf-online-banking-prod-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY"
          docker build --platform linux/amd64 -t "$image:$GITHUB_SHA" -t "$image:latest" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Roll App Runner and wait
        run: |
          arn="$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE_NAME'].ServiceArn" --output text)"
          aws apprunner start-deployment --service-arn "$arn" >/dev/null || true
          for _ in $(seq 1 60); do
            status="$(aws apprunner describe-service --service-arn "$arn" --query 'Service.Status' --output text)"
            echo "status=$status"
            [ "$status" = "RUNNING" ] && exit 0
            sleep 10
          done
          echo "App Runner did not reach RUNNING" >&2
          exit 1
