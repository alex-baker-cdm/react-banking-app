name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wf-online-banking
  APP_RUNNER_SERVICE_NAME: wf-online-banking-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::438468714515:role/wf-online-banking-prod-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY"
          docker build --platform linux/amd64 -t "$image:$GITHUB_SHA" -t "$image:latest" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Roll App Runner and wait
        run: |
          arn="$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE_NAME'].ServiceArn" --output text)"
          # The ECR push already triggers an automatic rollout (auto_deployments_enabled); if so, follow that
          # operation instead of failing on the overlapping start-deployment call.
          operation="$(aws apprunner start-deployment --service-arn "$arn" --query OperationId --output text 2>/dev/null \
            || aws apprunner list-operations --service-arn "$arn" --max-results 5 --query "OperationSummaryList[?Status=='IN_PROGRESS' || Status=='PENDING'] | [0].Id" --output text)"
          if [ -z "$operation" ] || [ "$operation" = "None" ]; then
            echo "No deployment could be started and none is pending or in progress" >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            status="$(aws apprunner list-operations --service-arn "$arn" --query "OperationSummaryList[?Id=='$operation'].Status" --output text)"
            echo "deployment $operation: $status"
            case "$status" in
              SUCCEEDED) exit 0 ;;
              FAILED|ROLLBACK_SUCCEEDED|ROLLBACK_FAILED) echo "App Runner deployment failed ($status)" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "App Runner deployment did not finish in time" >&2
          exit 1
